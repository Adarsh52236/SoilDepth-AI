[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soildepth-ai"
version = "0.1.0"
description = "AI-based root-zone soil-moisture estimation and irrigation decision-support system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "SoilDepth-AI Contributors" }
]
dependencies = [
    "click>=8.1.7",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
]
geo = [
    "geopandas>=0.14.0",
    "netcdf4>=1.6.5",
    "rasterio>=1.3.9",
    "xarray>=2024.3.0",
]

[project.scripts]
soildepth-preprocess = "soildepth_preprocessing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["data-pipeline/src/soildepth_preprocessing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["soildepth_preprocessing"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["data-pipeline/tests", "tests"]
pythonpath = ["data-pipeline/src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
